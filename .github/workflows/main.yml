name: Auto Fetch Geek Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 🚀 执行抓取脚本
        run: node fetch_geek.js

      - name: 💾 提交并推送最新数据
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update geek data [skip ci]"
          file_pattern: data.json
